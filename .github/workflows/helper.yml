# Publishes the ASH//FLOW helper to Cloudflare whenever helper/ changes (or when run by hand).
# Writes the helper's address to beta/helper.json and a short deploy report to helper/last-deploy.txt.
name: Deploy helper
on:
  push:
    branches: [main]
    paths: ["helper/**", ".github/workflows/helper.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: helper-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make sure the account has a workers.dev address
        id: sub
        run: |
          set -o pipefail
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          R=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API)
          echo "subdomain lookup: $(echo "$R" | head -c 400)" | tee -a report.txt
          SUB=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain") or "")' || true)
          if [ -z "$SUB" ]; then
            WANT="ashflow-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6)"
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$WANT\"}" $API)
            echo "subdomain create: $(echo "$R" | head -c 400)" | tee -a report.txt
            SUB=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain") or "")' || true)
          fi
          echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Deploy
        id: deploy
        working-directory: helper
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log
      - name: Check it answers
        if: success()
        run: |
          URL="https://ashflow-helper.${{ steps.sub.outputs.sub }}.workers.dev"
          for i in 1 2 3 4 5 6; do
            OUT=$(curl -s --max-time 10 "$URL/health" || true)
            echo "health try $i: $OUT" | tee -a report.txt
            echo "$OUT" | grep -q ashflow-helper && break
            sleep 10
          done
          printf '{"url":"%s"}\n' "$URL" > beta/helper.json
      - name: Save report
        if: always()
        run: |
          { echo "Deploy run: $(date -u)"; echo "Result: ${{ job.status }}"; cat report.txt 2>/dev/null; echo "--- wrangler (last 60 lines) ---"; tail -n 60 deploy.log 2>/dev/null; } > helper/last-deploy.txt
          git config user.name "helper-deploy"; git config user.email "helper-deploy@users.noreply.github.com"
          git add helper/last-deploy.txt beta/helper.json 2>/dev/null || git add helper/last-deploy.txt
          git commit -m "Helper deploy report [skip ci]" || exit 0
          git pull --rebase -q || true
          git push || true
